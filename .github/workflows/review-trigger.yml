name: Trigger fleet policy review

# On each pull request in this repo, starts a review of that PR against the
# jbaruch/coding-policy coding rules. Claude quality reviews and the scheduled
# marker are temporarily disabled at the operator's request (quota exhausted).
# Fork and Dependabot PRs require a manual policy-only dispatch.
#
# Requires one repo secret (set it at
# https://github.com/jbaruch/agentic-camtasia/settings/secrets/actions):
#   FLEET_DISPATCH_TOKEN — the token this workflow reads to start the review run in
#     jbaruch/coding-policy. Create it with Actions: Read and write on jbaruch/coding-policy.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: trigger-fleet-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trigger:
    # Fork PRs cannot read secrets — skip them (adopt via the adopt-fork-pr skill).
    # Dependabot's actor also gets no secrets.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the single-PR review to coding-policy
        env:
          GH_TOKEN: ${{ secrets.FLEET_DISPATCH_TOKEN }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::FLEET_DISPATCH_TOKEN is unset; dispatch fleet-review.yml manually with reviewer=policy and require its posted verdict before merging. See this workflow's header to enable automatic dispatch."
            exit 0
          fi
          gh workflow run fleet-review.yml \
            --repo jbaruch/coding-policy \
            -f repo="$REPO" -f pr="$PR" -f base="$BASE" -f reviewer=policy
